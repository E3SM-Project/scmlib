%YAML 1.1
---
averaging_type: average
max_snapshots_per_file: 100000
filename_prefix: ${CASE}.horiz_avg
fields:
  physics_pg2:
    field_names:
    - z_mid_horiz_avg := z_mid.mean('col')
    - p_mid_horiz_avg := p_mid.mean('col')
    # HOMME
    - ps_horiz_avg := ps.mean('col')
    - omega_horiz_avg := omega.mean('col')
    # SHOC
    - cldfrac_liq_horiz_avg := cldfrac_liq.mean('col')
    - eddy_diff_mom_horiz_avg := eddy_diff_mom.mean('col')
    - sgs_buoy_flux_horiz_avg := sgs_buoy_flux.mean('col')
    - tke_horiz_avg := tke.mean('col')
    - inv_qc_relvar_horiz_avg := inv_qc_relvar.mean('col')
    - pbl_height_horiz_avg := pbl_height.mean('col')
    # CLD
    - cldfrac_ice_horiz_avg := cldfrac_ice.mean('col')
    - cldfrac_tot_horiz_avg := cldfrac_tot.mean('col')
    - cldfrac_tot_for_analysis_horiz_avg := cldfrac_tot_for_analysis.mean('col')
    # P3
    - bm_horiz_avg := bm.mean('col')
    - nc_horiz_avg := nc.mean('col')
    - ni_horiz_avg := ni.mean('col')
    - nr_horiz_avg := nr.mean('col')
    - qi_horiz_avg := qi.mean('col')
    - qm_horiz_avg := qm.mean('col')
    - qr_horiz_avg := qr.mean('col')
    - T_prev_micro_step_horiz_avg := T_prev_micro_step.mean('col')
    - qv_prev_micro_step_horiz_avg := qv_prev_micro_step.mean('col')
    - eff_radius_qc_horiz_avg := eff_radius_qc.mean('col')
    - eff_radius_qi_horiz_avg := eff_radius_qi.mean('col')
    - eff_radius_qr_horiz_avg := eff_radius_qr.mean('col')
    - micro_liq_ice_exchange_horiz_avg := micro_liq_ice_exchange.mean('col')
    - micro_vap_ice_exchange_horiz_avg := micro_vap_ice_exchange.mean('col')
    - micro_vap_liq_exchange_horiz_avg := micro_vap_liq_exchange.mean('col')
    - precip_liq_surf_mass_flux_horiz_avg := precip_liq_surf_mass_flux.mean('col')
    - precip_ice_surf_mass_flux_horiz_avg := precip_ice_surf_mass_flux.mean('col')
    - precip_total_surf_mass_flux_horiz_avg := precip_total_surf_mass_flux.mean('col')
    # SHOC + HOMME
    - U_horiz_avg := U.mean('col')
    - V_horiz_avg := V.mean('col')
    # SHOC + P3
    - qc_horiz_avg := qc.mean('col')
    - qv_horiz_avg := qv.mean('col')
    # SHOC + P3 + RRTMGP + HOMME
    - T_mid_horiz_avg := T_mid.mean('col')
    # RRTMGP
    - rad_heating_pdel_horiz_avg := rad_heating_pdel.mean('col')
    - sfc_flux_lw_dn_horiz_avg := sfc_flux_lw_dn.mean('col')
    - sfc_flux_sw_net_horiz_avg := sfc_flux_sw_net.mean('col')
    - ShortwaveCloudForcing_horiz_avg := ShortwaveCloudForcing.mean('col')
    - LongwaveCloudForcing_horiz_avg := LongwaveCloudForcing.mean('col')
    - LiqWaterPath_horiz_avg := LiqWaterPath.mean('col')
    - IceWaterPath_horiz_avg := IceWaterPath.mean('col')
    - RainWaterPath_horiz_avg := RainWaterPath.mean('col')
    - RimeWaterPath_horiz_avg := RimeWaterPath.mean('col')
    - VapWaterPath_horiz_avg := VapWaterPath.mean('col')
    - ZonalVapFlux_horiz_avg := ZonalVapFlux.mean('col')
    - MeridionalVapFlux_horiz_avg := MeridionalVapFlux.mean('col')
    - SW_flux_up_at_model_top_horiz_avg := SW_flux_up.isel(lev=0).mean('col')
    - SW_flux_dn_at_model_top_horiz_avg := SW_flux_dn.isel(lev=0).mean('col')
    - LW_flux_up_at_model_top_horiz_avg := LW_flux_up.isel(lev=0).mean('col')
    - SW_flux_dn_at_model_bot_horiz_avg := SW_flux_dn.isel(lev=-1).mean('col')
    - SW_flux_up_at_model_bot_horiz_avg := SW_flux_up.isel(lev=-1).mean('col')
    - LW_flux_dn_at_model_bot_horiz_avg := LW_flux_dn.isel(lev=-1).mean('col')
    - LW_flux_up_at_model_bot_horiz_avg := LW_flux_up.isel(lev=-1).mean('col')
    - SW_clrsky_flux_up_at_model_top_horiz_avg := SW_clrsky_flux_up.isel(lev=0).mean('col')
    - LW_clrsky_flux_up_at_model_top_horiz_avg := LW_clrsky_flux_up.isel(lev=0).mean('col')
    - SW_clrsky_flux_dn_at_model_bot_horiz_avg := SW_clrsky_flux_dn.isel(lev=-1).mean('col')
    - SW_clrsky_flux_up_at_model_bot_horiz_avg := SW_clrsky_flux_up.isel(lev=-1).mean('col')
    - LW_clrsky_flux_dn_at_model_bot_horiz_avg := LW_clrsky_flux_dn.isel(lev=-1).mean('col')
    - LW_clrsky_flux_up_at_model_bot_horiz_avg := LW_clrsky_flux_up.isel(lev=-1).mean('col')
    # diag
    - PotentialTemperature_horiz_avg := PotentialTemperature.mean('col')
    - LiqPotentialTemperature_horiz_avg := LiqPotentialTemperature.mean('col')
    - DryStaticEnergy_horiz_avg := DryStaticEnergy.mean('col')
    - RelativeHumidity_horiz_avg := RelativeHumidity.mean('col')
    - surface_upward_latent_heat_flux_horiz_avg := surface_upward_latent_heat_flux.mean('col')
    # coupler
    - surf_radiative_T_horiz_avg := surf_radiative_T.mean('col')
    - T_2m_horiz_avg := T_2m.mean('col')
    - qv_2m_horiz_avg := qv_2m.mean('col')
    - wind_speed_10m_horiz_avg := wind_speed_10m.mean('col')
    - surf_mom_flux_horiz_avg := surf_mom_flux.mean('col')
    - surf_sens_flux_horiz_avg := surf_sens_flux.mean('col')
    - surf_evap_horiz_avg := surf_evap.mean('col')
    # Process rates
    - shoc_T_mid_tend_horiz_avg := shoc_T_mid_tend.mean('col')
    - p3_T_mid_tend_horiz_avg := p3_T_mid_tend.mean('col')
    - rrtmgp_T_mid_tend_horiz_avg := rrtmgp_T_mid_tend.mean('col')
    - shoc_qv_tend_horiz_avg := shoc_qv_tend.mean('col')
    - p3_qv_tend_horiz_avg := p3_qv_tend.mean('col')
    - homme_T_mid_tend_horiz_avg := homme_T_mid_tend.mean('col')
    - homme_qv_tend_horiz_avg := homme_qv_tend.mean('col')
    - iop_forcing_T_mid_tend_horiz_avg := iop_forcing_T_mid_tend.mean('col')
    - iop_forcing_qv_tend_horiz_avg := iop_forcing_qv_tend.mean('col')    
    # Select level output
    - PotentialTemperature_at_700hPa_horiz_avg := PotentialTemperature.interp(p_mid=700,units='hPa').mean('col')
    - PotentialTemperature_at_1000hPa_horiz_avg := PotentialTemperature.interp(p_mid=1000,units='hPa').mean('col')
    - omega_at_500hPa_horiz_avg := omega.interp(p_mid=500,units='hPa').mean('col')
    - RelativeHumidity_at_700hPa_horiz_avg := RelativeHumidity.interp(p_mid=700,units='hPa').mean('col')
    - T_mid_at_model_bot_horiz_avg := T_mid.isel(lev=-1).mean('col')
    - SeaLevelPressure_horiz_avg := SeaLevelPressure.mean('col')
    # ADD SHOC DIAGS (must set ./atmchange extra_shoc_diags=true)
    - shoc_mix_horiz_avg := shoc_mix.mean('col')
    - wthl_sec_horiz_avg := wthl_sec.mean('col')
    - wqw_sec_horiz_avg := wqw_sec.mean('col')
    - qw_sec_horiz_avg := qw_sec.mean('col')
    - thl_sec_horiz_avg := thl_sec.mean('col')
    - uw_sec_horiz_avg := uw_sec.mean('col')
    - vw_sec_horiz_avg := vw_sec.mean('col')
    - w3_horiz_avg := w3.mean('col')
    - w_variance_horiz_avg := w_variance.mean('col')    
output_control:
  frequency: 15
  frequency_units: nmins
